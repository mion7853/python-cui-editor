<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<title>Python CUI Editor</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--line:#2d313b;--fg:#e8eaf0;--mut:#8b91a0;--acc:#5b8cff;--vh:100vh;--side:240px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100%;height:100vh;height:var(--vh);display:flex;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px}
#canvas{position:relative;flex:none;background:#0c0d10;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line);cursor:text;
 font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,"MS Gothic","Noto Sans Mono CJK JP",monospace;font-size:calc(var(--cw)*1.6);line-height:calc(var(--cw)*2)}
#inner{position:absolute;left:0;top:0;transform-origin:0 0;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,"MS Gothic","Noto Sans Mono CJK JP",monospace;font-size:16px;font-kerning:none;font-variant-ligatures:none}
#layer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;white-space:pre;pointer-events:none}
#m{position:absolute;left:0;top:0;visibility:hidden;white-space:pre}
#ta{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;outline:0;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;font:inherit;white-space:pre;-webkit-appearance:none;appearance:none;tab-size:4;user-select:text;-webkit-user-select:text}
#ta::placeholder{color:#4a4f5c;-webkit-text-fill-color:#4a4f5c;opacity:1}
#ta::selection{background:rgba(91,140,255,.45)}
/* sidebar */
#side{width:var(--side);flex:none;background:var(--panel);border-left:1px solid var(--line);padding:58px 14px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;z-index:5}
body.closed #side{display:none}
#scrim{display:none}
.row{display:flex;gap:14px;align-items:flex-start}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.circ{width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:#444;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 0 0 1px #000 inset}
.circ.dl{background:var(--acc);border-color:var(--acc);font-size:10px;font-weight:700;letter-spacing:-.2px}
.circ.sm{width:44px;height:44px;font-size:20px;background:#2a2e3a;border:1px solid var(--line)}
.circ:active{transform:scale(.94)}
#toggle{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 6px);width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(29,32,39,.88);color:var(--fg);font-size:22px;cursor:pointer;padding:0}
#picker{display:flex;flex-direction:column;gap:10px}
#picker[hidden]{display:none}
#sv{position:relative;height:130px;border-radius:6px;touch-action:none;cursor:crosshair;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(210,100%,50%))}
#hue{position:relative;height:22px;border-radius:11px;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.th{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #000,0 0 0 1px #000 inset;pointer-events:none}
#hueT{top:50%}
.fields{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px;font-size:11px;color:var(--mut)}
.fields input{width:100%;min-width:0;height:36px;border-radius:6px;border:1px solid var(--line);background:#14161b;color:var(--fg);padding:0 6px;font:16px monospace}
.note{font-size:11px;color:var(--mut);line-height:1.5}
#side{overflow-x:hidden}
.row{flex-wrap:wrap;gap:12px}
#gpanel{display:flex;flex-direction:column;gap:10px;min-width:0}
#gpanel[hidden]{display:none}
.gends{display:flex;align-items:center;gap:8px;min-width:0}
.gsw{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid #555;padding:0;cursor:pointer}
.gsw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
#gPrev{flex:1;min-width:0;height:44px;border-radius:8px;border:1px solid var(--line)}
.gpat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gpat button{height:40px;min-width:0;border-radius:8px;border:2px solid var(--line);padding:0;cursor:pointer}
.gpat button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
#gsv{position:relative;height:100px;border-radius:6px;touch-action:none;cursor:crosshair}
#ghue{position:relative;height:22px;border-radius:11px;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#ghueT{top:50%}
#ghex{width:100%;min-width:0;height:36px;border-radius:6px;border:1px solid var(--line);background:#14161b;color:var(--fg);padding:0 8px;font:16px monospace}
.wide{height:44px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.wide:active{transform:scale(.98)}
@media (max-width:900px),(max-height:520px){
 #stage{padding:0}
 #side{position:absolute;right:0;top:0;bottom:0;display:flex!important;transform:translateX(100%);visibility:hidden;transition:transform .18s,visibility 0s .18s;padding-right:calc(14px + env(safe-area-inset-right));box-shadow:-8px 0 24px rgba(0,0,0,.5);width:min(var(--side),70vw)}
 body:not(.closed) #side{transform:none;visibility:visible;transition:transform .18s}
 body:not(.closed) #scrim{display:block;position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.35)}
}
</style>
</head>
<body class="closed">
<div id="app">
 <main id="stage">
  <div id="canvas" aria-label="Editing canvas">
   <div id="inner"><span id="m"></span><div id="layer"></div><textarea id="ta" wrap="off" placeholder="Tap here to type" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Text input"></textarea></div>
  </div>
 </main>
 <div id="scrim"></div>
 <aside id="side" aria-label="Controls">
  <div class="row">
   <div class="item"><button class="circ" id="colorBtn" aria-label="Text color"></button>Color</div>
   <div class="item"><button class="circ dl" id="dlBtn" aria-label="Download main.py">Download</button>main.py</div>
   <div class="item"><button class="circ" id="gBtn" aria-label="Gradient"></button>Gradient</div>
  </div>
  <div id="picker" hidden>
   <div id="sv"><i class="th" id="svT"></i></div>
   <div id="hue"><i class="th" id="hueT"></i></div>
   <div class="fields">
    <label>HEX<input id="hex" maxlength="7" autocomplete="off" spellcheck="false"></label>
    <label>R<input id="r" type="number" min="0" max="255" inputmode="numeric"></label>
    <label>G<input id="g" type="number" min="0" max="255" inputmode="numeric"></label>
    <label>B<input id="b" type="number" min="0" max="255" inputmode="numeric"></label>
   </div>
  </div>
  <div id="gpanel" hidden>
   <div class="gends">
    <button class="gsw on" id="gS" aria-label="Start color"></button>
    <div id="gPrev"></div>
    <button class="gsw" id="gE" aria-label="End color"></button>
   </div>
   <div class="gpat" id="gPat">
    <button data-p="h" aria-label="Horizontal (left to right)" style="background:linear-gradient(to right,#3a3f4b,#fff)"></button>
    <button data-p="v" aria-label="Vertical (top to bottom)" style="background:linear-gradient(to bottom,#3a3f4b,#fff)"></button>
    <button data-p="bl" aria-label="Top right to bottom left" style="background:linear-gradient(to bottom left,#3a3f4b,#fff)"></button>
    <button data-p="br" aria-label="Top left to bottom right" style="background:linear-gradient(to bottom right,#3a3f4b,#fff)"></button>
   </div>
   <div id="gsv"><i class="th" id="gsvT"></i></div>
   <div id="ghue"><i class="th" id="ghueT"></i></div>
   <input id="ghex" maxlength="7" autocomplete="off" spellcheck="false" aria-label="HEX">
   <p class="note" id="gInfo"></p>
   <button class="wide" id="gApply">Apply to selection</button>
  </div>
  <div class="row">
   <div class="item"><button class="circ sm" id="undoBtn" aria-label="Undo">↶</button>Undo</div>
   <div class="item"><button class="circ sm" id="redoBtn" aria-label="Redo">↷</button>Redo</div>
  </div>
  <p class="note">96×27 cells (16:9). Full-width characters take 2 cells. Select a range, then pick a color to recolor just that part.</p>
 </aside>
 <button id="toggle" aria-label="Sidebar" aria-expanded="false">☰</button>
</div>
<script>
(()=>{
'use strict';
const COLS=96, ROWS=27;               // terminal grid; cell is 1:2 => 96x54 units = 16:9
const $=id=>document.getElementById(id);
const canvas=$('canvas'),layer=$('layer'),ta=$('ta'),stage=$('stage'),app=$('app');

/* ===== Document model: lines -> cells {c:char,k:'#rrggbb'} =====
   The <textarea> (native selection, caret, copy/paste, IME) is the input;
   colors live in doc.lines and are drawn in a mirrored layer underneath. */
const inner=$('inner'),mEl=$('m');mEl.textContent='M'.repeat(100);
const doc={lines:[[]],color:'#e8eaf0',undo:[],redo:[]};
const W=c=>{const p=c.codePointAt(0);return (p>=0x1100&&p<=0x115F)||(p>=0x2E80&&p<=0xA4CF)||(p>=0xAC00&&p<=0xD7A3)||(p>=0xF900&&p<=0xFAFF)||(p>=0xFE30&&p<=0xFE6F)||(p>=0xFF00&&p<=0xFF60)||(p>=0xFFE0&&p<=0xFFE6)||(p>=0x1F300&&p<=0x1F64F)||(p>=0x1F900&&p<=0x1F9FF)||(p>=0x20000&&p<=0x3FFFD)?2:1};
const textOf=()=>doc.lines.map(L=>L.map(x=>x.c).join('')).join('\n');
const cpIdx=off=>Array.from(ta.value.slice(0,off)).length;
const hasSel=()=>ta.selectionStart!==ta.selectionEnd;
const valid=v=>{const L=v.split('\n');return L.length<=ROWS&&L.every(t=>{let w=0;for(const c of t)w+=W(c);return w<=COLS})};
let composing=false,prevSel=[0,0],compBase=null;
const saveSel=()=>{prevSel=[ta.selectionStart,ta.selectionEnd]};
const snap=sel=>{doc.undo.push({l:JSON.stringify(doc.lines),s:sel||[ta.selectionStart,ta.selectionEnd]});if(doc.undo.length>100)doc.undo.shift();doc.redo.length=0};
const cur=()=>({l:JSON.stringify(doc.lines),s:[ta.selectionStart,ta.selectionEnd]});
function load(o){doc.lines=JSON.parse(o.l);ta.value=textOf();ta.setSelectionRange(o.s[0],o.s[1]);render()}
function undo(){if(doc.undo.length){doc.redo.push(cur());load(doc.undo.pop())}}
function redo(){if(doc.redo.length){doc.undo.push(cur());load(doc.redo.pop())}}

/* textarea text -> model (inserted chars get the current color, others keep theirs) */
function sync(){
  let v=ta.value;
  const clean=v.replace(/\t/g,'    ').replace(/[\u0000-\u0008\u000B-\u001F\u007F]/g,'');
  if(clean!==v){
    const pos=v.slice(0,ta.selectionEnd).replace(/\t/g,'    ').replace(/[\u0000-\u0008\u000B-\u001F\u007F]/g,'').length;
    ta.value=clean;ta.setSelectionRange(pos,pos);v=clean;
  }
  const prev=textOf();
  if(v===prev){render();return}
  if(!composing&&!valid(v)){ta.value=prev;ta.setSelectionRange(prevSel[0],prevSel[1]);return}
  if(!composing)snap(prevSel);
  const old=[];doc.lines.forEach((L,r)=>{if(r)old.push({c:'\n'});L.forEach(x=>old.push(x))});
  const nw=Array.from(v),cn=cpIdx(ta.selectionEnd),mm=Math.min(old.length,nw.length);
  const tailOk=n=>{if(n<0||n>mm)return false;for(let i=0;i<n;i++)if(old[old.length-1-i].c!==nw[nw.length-1-i])return false;return true};
  let s=nw.length-cn;                       // the edit ends at the caret
  if(!tailOk(s)){s=0;let p0=0;while(p0<mm&&old[p0].c===nw[p0])p0++;while(s<mm-p0&&old[old.length-1-s].c===nw[nw.length-1-s])s++}
  let p=0;const m2=mm-s;while(p<m2&&old[p].c===nw[p])p++;
  const mid=nw.slice(p,nw.length-s).map(c=>({c,k:doc.color}));
  const all=old.slice(0,p).concat(mid,old.slice(old.length-s));
  const lines=[[]];for(const x of all){if(x.c==='\n')lines.push([]);else lines[lines.length-1].push(x)}
  doc.lines=lines;render();
}
function applyColorToSel(hex){
  const a=cpIdx(ta.selectionStart),b=cpIdx(ta.selectionEnd);let i=0;
  doc.lines.forEach((L,r)=>{if(r)i++;L.forEach(x=>{if(i>=a&&i<b)x.k=hex;i++})});
}

/* ===== Rendering (colored mirror of the textarea text) ===== */
const esc=c=>c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;
function render(){
  let h='';
  doc.lines.forEach((L,r)=>{
    if(r)h+='\n';let k=null;
    for(const x of L){if(x.k!==k){if(k!==null)h+='</span>';h+=`<span style="color:${x.k}">`;k=x.k}h+=esc(x.c)}
    if(k!==null)h+='</span>';
  });
  layer.innerHTML=h;
  layer.scrollLeft=ta.scrollLeft;layer.scrollTop=ta.scrollTop;
  ensureVisible();
}
ta.addEventListener('scroll',()=>{layer.scrollLeft=ta.scrollLeft;layer.scrollTop=ta.scrollTop});

/* ===== Layout (viewport-aware, 16:9, unaffected by the on-screen keyboard) ===== */
let baseH=0,baseW=0;   // layout height WITHOUT the keyboard
function ensureVisible(){
  const vv=window.visualViewport;let sh=0;
  if(vv&&baseH&&vv.height<baseH*0.75){
    const cw=canvas.clientWidth/COLS,row=ta.value.slice(0,ta.selectionEnd).split('\n').length-1;
    const top=canvas.offsetTop+row*2*cw,vTop=vv.offsetTop+4,vBot=vv.offsetTop+vv.height-4;
    sh=Math.min(0,vBot-(top+4*cw));
    if(top+sh<vTop)sh=vTop-top;
  }
  canvas.style.transform=sh?`translateY(${sh}px)`:'';
}
function layout(){
  const vv=window.visualViewport,vh=vv?vv.height:innerHeight;
  if(innerWidth!==baseW){baseW=innerWidth;baseH=Math.max(innerHeight,vh)}
  else if(vh>=baseH*0.75)baseH=vh;
  document.documentElement.style.setProperty('--vh',baseH+'px');
  const cs=getComputedStyle(stage);
  const pw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ph=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const cw=Math.max(1,Math.floor(Math.min(pw,ph*16/9)/COLS*4)/4);
  canvas.style.width=cw*COLS+'px';canvas.style.height=cw*ROWS*2+'px';
  // text is laid out at 16px (avoids iOS focus-zoom) and scaled to the grid
  const adv=mEl.offsetWidth/100||9.6;
  inner.style.width=COLS*adv+'px';inner.style.height=ROWS*2*adv+'px';
  inner.style.lineHeight=2*adv+'px';inner.style.transform=`scale(${cw/adv})`;
  ensureVisible();
}
new ResizeObserver(layout).observe(stage);
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,150));
if(window.visualViewport){visualViewport.addEventListener('resize',layout);visualViewport.addEventListener('scroll',layout)}
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)ensureVisible()});

/* ===== Input events ===== */
ta.addEventListener('beforeinput',e=>{
  saveSel();
  if(e.inputType==='historyUndo'){e.preventDefault();undo()}
  else if(e.inputType==='historyRedo'){e.preventDefault();redo()}
});
ta.addEventListener('input',()=>sync());
ta.addEventListener('compositionstart',()=>{saveSel();snap(prevSel);compBase=doc.undo[doc.undo.length-1];composing=true});
ta.addEventListener('compositionend',()=>{
  composing=false;sync();
  if(!valid(ta.value)){load(compBase);doc.undo.pop()}
});
ta.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  const m=e.ctrlKey||e.metaKey,l=e.key.toLowerCase();
  if(m&&l==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&l==='y'){e.preventDefault();redo()}
  else if(e.key==='Tab'){e.preventDefault();saveSel();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');sync()}
});

/* ===== Color picker ===== */
const hsv={h:222,s:.1,v:.94};
const toRgb=({h,s,v})=>{const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))};
const toHex=rgb=>'#'+rgb.map(x=>x.toString(16).padStart(2,'0')).join('');
function fromRgb(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  hsv.h=d?h:hsv.h;hsv.s=mx?d/mx:0;hsv.v=mx;
}
let needSnap=false;
function commit(skipHex){
  const rgb=toRgb(hsv),hex=toHex(rgb);doc.color=hex;
  $('colorBtn').style.background=hex;
  $('sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${hsv.h},100%,50%))`;
  $('svT').style.left=hsv.s*100+'%';$('svT').style.top=(1-hsv.v)*100+'%';
  $('hueT').style.left=hsv.h/360*100+'%';
  $('svT').style.background=hex;$('hueT').style.background=`hsl(${hsv.h},100%,50%)`;
  if(!skipHex)$('hex').value=hex;
  ['r','g','b'].forEach((id,n)=>{if(document.activeElement!==$(id))$(id).value=rgb[n]});
  if(hasSel()){if(needSnap){snap();needSnap=false}applyColorToSel(hex);render()}
}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function dragger(el,fn){
  el.addEventListener('pointerdown',e=>{e.preventDefault();needSnap=true;el.setPointerCapture(e.pointerId);el._d=true;fn(e,el.getBoundingClientRect())});
  el.addEventListener('pointermove',e=>{if(el._d)fn(e,el.getBoundingClientRect())});
  el.addEventListener('pointerup',()=>{el._d=false});el.addEventListener('pointercancel',()=>{el._d=false});
}
dragger($('sv'),(e,b)=>{hsv.s=cl((e.clientX-b.left)/b.width,0,1);hsv.v=1-cl((e.clientY-b.top)/b.height,0,1);commit()});
dragger($('hue'),(e,b)=>{hsv.h=cl((e.clientX-b.left)/b.width,0,1)*359.99;commit()});
$('hex').addEventListener('focus',()=>needSnap=true);
$('hex').addEventListener('input',e=>{
  const m=/^#?([0-9a-f]{6})$/i.exec(e.target.value.trim());
  if(m){const n=parseInt(m[1],16);fromRgb(n>>16,(n>>8)&255,n&255);commit(true)}
});
['r','g','b'].forEach(id=>{
  $(id).addEventListener('focus',()=>needSnap=true);
  $(id).addEventListener('input',()=>{
    const v=['r','g','b'].map(i=>cl(parseInt($(i).value,10)||0,0,255));
    fromRgb(...v);commit();
  });
});
$('colorBtn').addEventListener('click',()=>{const p=$('picker');p.hidden=!p.hidden;if(!p.hidden)$('gpanel').hidden=true});
$('undoBtn').addEventListener('click',undo);
$('redoBtn').addEventListener('click',redo);

/* ===== Gradient (own palette, independent of the text-color picker) ===== */
const gr={e:[{h:0,s:.85,v:1},{h:220,s:.85,v:1}],act:0,pat:'h'};
const gCss={h:'to right',v:'to bottom',bl:'to bottom left',br:'to bottom right'};
const gRgb=i=>toRgb(gr.e[i]),gHex=i=>toHex(gRgb(i));
function hsvOf(r,g,b,h0){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  return{h:d?h:h0,s:mx?d/mx:0,v:mx};
}
function gUpdate(skipHex){
  const e=gr.e[gr.act],hx=gHex(gr.act),grad=`linear-gradient(${gCss[gr.pat]},${gHex(0)},${gHex(1)})`;
  $('gsv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${e.h},100%,50%))`;
  $('gsvT').style.left=e.s*100+'%';$('gsvT').style.top=(1-e.v)*100+'%';$('gsvT').style.background=hx;
  $('ghueT').style.left=e.h/360*100+'%';$('ghueT').style.background=`hsl(${e.h},100%,50%)`;
  $('gS').style.background=gHex(0);$('gE').style.background=gHex(1);
  $('gS').classList.toggle('on',gr.act===0);$('gE').classList.toggle('on',gr.act===1);
  $('gPrev').style.background=grad;$('gBtn').style.background=grad;
  if(!skipHex)$('ghex').value=hx;
  document.querySelectorAll('#gPat button').forEach(b=>b.classList.toggle('on',b.dataset.p===gr.pat));
}
function gInfo(){
  if($('gpanel').hidden)return;
  const n=hasSel()?cpIdx(ta.selectionEnd)-cpIdx(ta.selectionStart):0;
  $('gInfo').textContent=n?`Selected: ${n} chars`:'Select a range on the canvas first';
}
function applyGradient(){
  if(!hasSel()){gInfo();return}
  const a=cpIdx(ta.selectionStart),b=cpIdx(ta.selectionEnd),cells=[];let i=0;
  doc.lines.forEach((L,r)=>{if(r)i++;let col=0;L.forEach(x=>{const w=W(x.c);if(i>=a&&i<b&&x.c!==' ')cells.push({x,r,c:col+w/2});col+=w;i++})});
  if(!cells.length)return;
  let x0=Infinity,x1=-Infinity;for(const o of cells){if(o.c<x0)x0=o.c;if(o.c>x1)x1=o.c}
  const r0=cells[0].r,r1=cells[cells.length-1].r,c0=gRgb(0),c1=gRgb(1);
  snap();
  for(const o of cells){
    const nx=x1>x0?(o.c-x0)/(x1-x0):0,ny=r1>r0?(o.r-r0)/(r1-r0):0;let ts;
    if(gr.pat==='h')ts=[nx];else if(gr.pat==='v')ts=[ny];
    else{ts=[];if(x1>x0)ts.push(gr.pat==='br'?nx:1-nx);if(r1>r0)ts.push(ny)}
    const t=ts.length?ts.reduce((p,q)=>p+q,0)/ts.length:0;
    o.x.k=toHex(c0.map((v,n)=>Math.round(v+(c1[n]-v)*t)));
  }
  render();
}
dragger($('gsv'),(e,b)=>{const t=gr.e[gr.act];t.s=cl((e.clientX-b.left)/b.width,0,1);t.v=1-cl((e.clientY-b.top)/b.height,0,1);gUpdate()});
dragger($('ghue'),(e,b)=>{gr.e[gr.act].h=cl((e.clientX-b.left)/b.width,0,1)*359.99;gUpdate()});
$('ghex').addEventListener('input',e=>{
  const m=/^#?([0-9a-f]{6})$/i.exec(e.target.value.trim());
  if(m){const n=parseInt(m[1],16);gr.e[gr.act]=hsvOf(n>>16,(n>>8)&255,n&255,gr.e[gr.act].h);gUpdate(true)}
});
$('gS').addEventListener('click',()=>{gr.act=0;gUpdate()});
$('gE').addEventListener('click',()=>{gr.act=1;gUpdate()});
$('gPat').addEventListener('click',e=>{const b=e.target.closest('button');if(b){gr.pat=b.dataset.p;gUpdate(true)}});
$('gBtn').addEventListener('click',()=>{const p=$('gpanel');p.hidden=!p.hidden;if(!p.hidden){$('picker').hidden=true;gInfo()}});
$('gApply').addEventListener('click',applyGradient);
document.addEventListener('selectionchange',gInfo);ta.addEventListener('select',gInfo);
gUpdate();

/* ===== Python export ===== */
const pyStr=s=>"'"+Array.from(s,c=>{
  const p=c.codePointAt(0);
  if(c==="'"||c==='\\')return'\\'+c;
  if(p>=32&&p<127)return c;
  return p<=0xFFFF?'\\u'+p.toString(16).padStart(4,'0'):'\\U'+p.toString(16).padStart(8,'0');
}).join('')+"'";
function buildPython(){
  const data=[];let last=-1;
  doc.lines.forEach((line,r)=>{
    let col=0,run=null;
    const flush=()=>{if(run&&run.t.trim()!==''){data.push(`    (${r}, ${run.c}, '${run.k}', ${pyStr(run.t)}),`);last=r}run=null};
    for(const x of line){
      if(!run||run.k0!==x.k){
        flush();
        const n=parseInt(x.k.slice(1),16);
        run={c:col,k0:x.k,k:`${n>>16};${(n>>8)&255};${n&255}`,t:''};
      }
      run.t+=x.c;col+=W(x.c);
    }
    flush();
  });
  return [
    '#!/usr/bin/env python3',
    '# -*- coding: utf-8 -*-',
    '# Generated by Python CUI Editor.',
    '# The terminal must support ANSI escape sequences and 24-bit true color',
    '# for the intended appearance. Use a terminal of at least '+COLS+'x'+ROWS+' cells.',
    'import os',
    'import sys',
    '',
    "if os.name == 'nt':",
    "    os.system('')  # enable ANSI escape processing on Windows consoles",
    '',
    '# (row, column, "R;G;B", text) -- 0-based terminal cells; wide characters take 2 cells.',
    'DATA = [',
    ...data,
    ']',
    'ROWS = '+(last+1),
    '',
    '',
    'def main():',
    "    out = ['\\x1b[0m\\x1b[2J\\x1b[H']",
    '    for row, col, rgb, text in DATA:',
    "        out.append('\\x1b[%d;%dH\\x1b[38;2;%sm%s' % (row + 1, col + 1, rgb, text))",
    "    out.append('\\x1b[0m\\x1b[%d;1H\\n' % (ROWS + 1))",
    "    sys.stdout.write(''.join(out))",
    '    sys.stdout.flush()',
    '',
    '',
    "if __name__ == '__main__':",
    '    main()',
    ''
  ].join('\n');
}
$('dlBtn').addEventListener('click',()=>{
  const url=URL.createObjectURL(new Blob([buildPython()],{type:'text/x-python;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='main.py';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});

/* ===== Sidebar ===== */
$('side').addEventListener('mousedown',e=>{if(!e.target.closest('input'))e.preventDefault()});
const mq=matchMedia('(max-width:900px),(max-height:520px)');
function setClosed(c){
  document.body.classList.toggle('closed',c);
  $('toggle').textContent=c?'☰':'✕';
  $('toggle').setAttribute('aria-expanded',String(!c));
  layout();
}
$('toggle').addEventListener('click',()=>setClosed(!document.body.classList.contains('closed')));
$('scrim').addEventListener('click',()=>setClosed(true));
mq.addEventListener('change',()=>setClosed(mq.matches));
ta.addEventListener('focus',()=>{});

setClosed(mq.matches);
commit();layout();render();
setTimeout(()=>{if(!mq.matches)ta.focus({preventScroll:true})},0);
})();
